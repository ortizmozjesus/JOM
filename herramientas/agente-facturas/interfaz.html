<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vista previa de la interfaz del agente de facturas.">
    <link rel="stylesheet" href="../../assets/css/fonts.css">
    <title>Agente de facturas, vista previa de la interfaz</title>
    <style>
/* Hallmark · shape: Tool interface preview · genre: editorial · theme: Studio · job: demo · same tokens as assets/css/studio.css */
:root{color-scheme:light;--color-paper:#f1f7f8;--color-paper-2:#e5edef;--color-ink:#0a1522;--color-muted:#58626a;--color-rule:#c4cccf;--color-accent:#ff2800;--color-accent-ink:#0a1522;--color-focus:#b31b00;--color-ok:#2f6b44;--log-ok:#9fd8b4;--log-warn:#f2c18d;--log-err:#f0a3a3;
--font-display:"Highland Gothic",ui-sans-serif,system-ui,sans-serif;--font-body:"Highland Gothic",ui-sans-serif,system-ui,sans-serif;--font-mono:ui-monospace,Menlo,Consolas,monospace;
--space-xs:8px;--space-sm:12px;--space-md:16px;--space-lg:24px;--dur:200ms;--ease:cubic-bezier(.16,1,.3,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
::selection{background:color-mix(in oklab,var(--color-accent) 30%,transparent)}
html{scrollbar-color:var(--color-muted) var(--color-paper)}
body{caret-color:var(--color-accent);font-family:var(--font-body);background:var(--color-paper);color:var(--color-ink);min-height:100vh;padding:var(--space-lg);font-size:1rem;line-height:1.5}
:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
.container{width:100%;max-width:1000px;margin-inline:auto}
.header{display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-md);flex-wrap:wrap;padding-bottom:var(--space-md)}
.header-title{font-family:var(--font-display);font-size:1.75rem;line-height:1.1}
.status-indicator{color:var(--color-ok);font-weight:500}
.tabs{display:flex;gap:var(--space-xs);margin-bottom:var(--space-lg)}
.tab{min-height:44px;padding:0 var(--space-md);background:transparent;color:var(--color-ink);border:1px solid var(--color-ink);border-radius:2px;font:inherit;font-weight:500;cursor:pointer;transition:background var(--dur) var(--ease)}
.tab:hover{background:var(--color-paper-2)}
.tab.active{background:var(--color-accent);color:var(--color-accent-ink)}
.content{background:var(--color-paper-2);padding:var(--space-lg)}
.tab-content{display:none}
.tab-content.active{display:block;animation:in 500ms var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.config-section{margin-bottom:var(--space-lg)}
.config-title{font-family:var(--font-display);font-size:1.25rem;margin-bottom:var(--space-md)}
.config-field{margin-bottom:var(--space-md)}
.config-field label,.log-label{display:block;color:var(--color-muted);margin-bottom:var(--space-xs)}
.log-label{margin-top:var(--space-lg)}
input,.select-field{width:100%;min-height:44px;padding:0 var(--space-sm);background:var(--color-paper);color:var(--color-ink);border:1px solid var(--color-rule);border-radius:2px;font:inherit;font-family:var(--font-mono);font-size:.9375rem;transition:border-color var(--dur) var(--ease)}
input:focus-visible,.select-field:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
.input-group{display:flex;gap:var(--space-xs)}
.btn-browse,.btn-save,.btn-process{min-height:44px;padding:0 var(--space-md);border:1px solid var(--color-ink);border-radius:2px;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;transition:background var(--dur) var(--ease),transform var(--dur) var(--ease)}
.btn-browse{background:transparent;color:var(--color-ink)}
.btn-browse:hover{background:var(--color-paper)}
.btn-save,.btn-process{background:var(--color-accent);color:var(--color-accent-ink)}
.btn-save:hover,.btn-process:hover{background:color-mix(in oklab,var(--color-accent) 86%,var(--color-ink))}
.btn-browse:active,.btn-save:active,.btn-process:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
.process-header{display:flex;justify-content:space-between;align-items:center;gap:var(--space-md);flex-wrap:wrap}
.state-display{font-weight:500}
.state-ready{color:var(--color-ok)}
.log-box{background:var(--color-ink);color:var(--color-paper);font-family:var(--font-mono);font-size:.875rem;padding:var(--space-md);min-height:160px;max-height:260px;overflow:auto;border-radius:2px}
.log-entry{padding:2px 0;animation:in 300ms var(--ease) both}
.log-success{color:var(--log-ok)}.log-warning{color:var(--log-warn)}.log-error{color:var(--log-err)}
.summary-box{background:var(--color-paper);padding:var(--space-md);border-radius:2px;font-family:var(--font-mono);font-size:.9375rem}
.summary-line{min-height:1.5em;white-space:pre-wrap}
@media (prefers-reduced-motion:reduce){.tab-content.active,.log-entry{animation:none}*{transition-duration:.01ms!important}}
</style>
<meta property="og:image" content="https://ortizmozjesus.github.io/JOM/assets/img/og-software.jpg"><meta property="og:type" content="website"></head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1 class="header-title" style="margin:0;font-size:inherit;font-weight:inherit">Agente de facturas</h1>
            <div class="status-indicator">
                <div class="status-dot"></div>
                Listo
            </div>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab(0)">Configuración</button>
            <button class="tab" onclick="switchTab(1)">Procesar</button>
        </div>

        <!-- CONTENT -->
        <div class="content">

            <!-- TAB 1: CONFIGURACIÓN -->
            <div class="tab-content active" id="tab0">
                
                <div class="config-section">
                    <div class="config-title">Autenticación</div>
                    <div class="config-field">
                        <label>API Key (Claude)</label>
                        <input type="password" placeholder="sk-ant-…" value="">
                    </div>
                </div>

                <div class="separator"></div>

                <div class="config-section">
                    <div class="config-title">Carpetas</div>
                    
                    <div class="config-field">
                        <label>Carpeta de Entrada (PDFs)</label>
                        <div class="input-group">
                            <input type="text" placeholder="C:\Facturas\Entrada" value="C:\Facturas\Entrada">
                            <button class="btn-browse">Examinar</button>
                        </div>
                    </div>

                    <div class="config-field">
                        <label>Carpeta Salida (JSON)</label>
                        <div class="input-group">
                            <input type="text" placeholder="C:\Facturas\Salida\JSON" value="C:\Facturas\Salida\JSON">
                            <button class="btn-browse">Examinar</button>
                        </div>
                    </div>

                    <div class="config-field">
                        <label>Carpeta Salida (CSV)</label>
                        <div class="input-group">
                            <input type="text" placeholder="C:\Facturas\Salida\CSV" value="C:\Facturas\Salida\CSV">
                            <button class="btn-browse">Examinar</button>
                        </div>
                    </div>
                </div>

                <div class="separator"></div>

                <div class="config-section">
                    <div class="config-title">Tipo de Documento</div>
                    <div class="config-field">
                        <label>Tipo</label>
                        <select class="select-field">
                            <option selected>factura_proveedor</option>
                            <option>factura_cliente</option>
                            <option>ticket</option>
                            <option>albarán</option>
                            <option>otro</option>
                        </select>
                    </div>
                </div>

                <button class="btn-save">Guardar configuración</button>
            </div>

            <!-- TAB 2: PROCESAR -->
            <div class="tab-content" id="tab1">
                
                <div class="process-header">
                    <div class="state-display state-ready">
                        <div class="state-dot-ready"></div>
                        Listo
                    </div>
                    <button class="btn-process" onclick="simulateProcessing()">Procesar facturas</button>
                </div>

                <div class="log-label">Log de ejecución</div>
                <div class="log-box" id="logBox">
                    <div class="log-entry log-info">[09:30:45] Agente iniciado</div>
                    <div class="log-entry log-info">[09:30:45] Configuración cargada </div>
                </div>

                <div class="log-label">Resumen</div>
                <div class="summary-box" id="summaryBox">
                    <div class="summary-line">Esperando procesamiento…</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function switchTab(index) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(el => {
                el.classList.remove('active');
            });

            // Show selected tab
            document.getElementById('tab' + index).classList.add('active');
            document.querySelectorAll('.tab')[index].classList.add('active');
        }

        function simulateProcessing() {
            const logBox = document.getElementById('logBox');
            const summaryBox = document.getElementById('summaryBox');
            
            // Clear log
            logBox.innerHTML = '';
            summaryBox.innerHTML = '<div class="summary-line">Procesando…</div>';

            // Simulate processing
            const steps = [
                { msg: '[09:31:00] Validando rutas…', type: 'info' },
                { msg: '[09:31:01] Rutas validadas', type: 'success' },
                { msg: '[09:31:02] Buscando PDFs en entrada…', type: 'info' },
                { msg: '[09:31:03] Encontrados 3 PDFs', type: 'success' },
                { msg: '', type: 'info' },
                { msg: '[09:31:04] [1/3] Procesando: factura-001.pdf', type: 'info' },
                { msg: '[09:31:09]   Extraído | 2145 tokens | €0.0321', type: 'success' },
                { msg: '[09:31:10]   Listo | Campos vacíos: 0', type: 'success' },
                { msg: '[09:31:11]   JSON guardado', type: 'success' },
                { msg: '', type: 'info' },
                { msg: '[09:31:12] [2/3] Procesando: factura-002.pdf', type: 'info' },
                { msg: '[09:31:17]   Extraído | 1998 tokens | €0.0299', type: 'success' },
                { msg: '[09:31:18]   REVISAR | Campos vacíos: 2', type: 'warning' },
                { msg: '[09:31:19]   JSON guardado', type: 'success' },
                { msg: '', type: 'info' },
                { msg: '[09:31:20] [3/3] Procesando: factura-003.pdf', type: 'info' },
                { msg: '[09:31:25]   Extraído | 2245 tokens | €0.0336', type: 'success' },
                { msg: '[09:31:26]   Listo | Campos vacíos: 0', type: 'success' },
                { msg: '[09:31:27]   JSON guardado', type: 'success' },
                { msg: '', type: 'info' },
                { msg: '[09:31:28] CSV guardado: resumen_2026-08-25_093128.csv', type: 'success' },
                { msg: '', type: 'info' },
                { msg: '════════════════════════════════════════════════', type: 'info' },
                { msg: 'Procesamiento completado', type: 'success' },
            ];

            let index = 0;
            const interval = setInterval(() => {
                if (index < steps.length) {
                    const step = steps[index];
                    if (step.msg) {
                        const div = document.createElement('div');
                        div.className = `log-entry log-${step.type}`;
                        div.textContent = step.msg;
                        logBox.appendChild(div);
                    }
                    logBox.scrollTop = logBox.scrollHeight;
                    index++;
                } else {
                    clearInterval(interval);
                    summaryBox.innerHTML = `
                        <div class="summary-line">Procesamiento completado</div>
                        <div class="summary-line"></div>
                        <div class="summary-line">  Total: 3 documentos</div>
                        <div class="summary-line">  Listos: 2 </div>
                        <div class="summary-line">  Revisar: 1 </div>
                        <div class="summary-line">  Coste total: €0.0956</div>
                        <div class="summary-line">  Éxito: 67%</div>
                    `;
                }
            }, 400);
        }
    </script>
</body>
</html>
