<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente de Facturas 01 - Preview Interfaz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title {
            font-size: 20px;
            font-weight: bold;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(46, 204, 113, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #2ecc71;
            font-size: 12px;
            color: #2ecc71;
            font-weight: bold;
            margin-left: auto;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #2ecc71;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* TABS */
        .tabs {
            display: flex;
            background: white;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: white;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
        }

        .tab:hover {
            background: #f5f5f5;
            color: #333;
        }

        .tab.active {
            background: white;
            color: #2ecc71;
            border-bottom: 3px solid #2ecc71;
            margin-bottom: -2px;
        }

        /* CONTENT AREA */
        .content {
            background: white;
            padding: 30px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* CONFIGURATION TAB */
        .config-section {
            margin-bottom: 30px;
        }

        .config-title {
            font-size: 14px;
            font-weight: bold;
            color: #1a1a2e;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
        }

        .config-field {
            margin-bottom: 20px;
        }

        .config-field label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .config-field input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            background: #f9f9f9;
        }

        .config-field input:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1);
            background: white;
        }

        .btn-browse {
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .btn-browse:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .select-field {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            background: #f9f9f9;
        }

        .select-field:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.1);
        }

        .btn-save {
            width: 100%;
            padding: 14px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-save:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        /* PROCESS TAB */
        .process-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .state-display {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .state-ready {
            color: #2ecc71;
        }

        .state-dot-ready {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #2ecc71;
            border-radius: 50%;
        }

        .btn-process {
            flex: 1;
            padding: 16px 30px;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-process:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.4);
        }

        .btn-process:active {
            transform: translateY(0);
        }

        /* LOG AREA */
        .log-label {
            font-size: 12px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .log-box {
            background: #1e1e2e;
            color: #00ff00;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            height: 200px;
            overflow-y: auto;
            border: 1px solid #444;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .log-entry {
            margin-bottom: 4px;
        }

        .log-success { color: #00ff00; }
        .log-warning { color: #ffaa00; }
        .log-error { color: #ff5555; }
        .log-info { color: #88ccff; }

        /* SUMMARY */
        .summary-box {
            background: #f0f8f0;
            border-left: 4px solid #2ecc71;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.8;
        }

        .summary-line {
            margin-bottom: 6px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .status-indicator {
                margin-left: 0;
                margin-top: 10px;
            }

            .input-group {
                flex-direction: column;
            }

            .btn-browse {
                width: 100%;
            }

            .process-header {
                flex-direction: column;
            }

            .btn-process {
                width: 100%;
            }
        }

        .separator {
            height: 1px;
            background: #e0e0e0;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-title">📄 AGENTE DE FACTURAS 01</div>
            <div class="status-indicator">
                <div class="status-dot"></div>
                ✓ LISTO
            </div>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab(0)">⚙ Configuración</button>
            <button class="tab" onclick="switchTab(1)">▶ Procesar</button>
        </div>

        <!-- CONTENT -->
        <div class="content">

            <!-- TAB 1: CONFIGURACIÓN -->
            <div class="tab-content active" id="tab0">
                
                <div class="config-section">
                    <div class="config-title">🔑 Autenticación</div>
                    <div class="config-field">
                        <label>API Key (Claude)</label>
                        <input type="password" placeholder="sk-ant-..." value="">
                    </div>
                </div>

                <div class="separator"></div>

                <div class="config-section">
                    <div class="config-title">📁 Carpetas</div>
                    
                    <div class="config-field">
                        <label>📥 Carpeta de Entrada (PDFs)</label>
                        <div class="input-group">
                            <input type="text" placeholder="C:\Facturas\Entrada" value="C:\Facturas\Entrada">
                            <button class="btn-browse">📁 Examinar</button>
                        </div>
                    </div>

                    <div class="config-field">
                        <label>📤 Carpeta Salida (JSON)</label>
                        <div class="input-group">
                            <input type="text" placeholder="C:\Facturas\Salida\JSON" value="C:\Facturas\Salida\JSON">
                            <button class="btn-browse">📁 Examinar</button>
                        </div>
                    </div>

                    <div class="config-field">
                        <label>📊 Carpeta Salida (CSV)</label>
                        <div class="input-group">
                            <input type="text" placeholder="C:\Facturas\Salida\CSV" value="C:\Facturas\Salida\CSV">
                            <button class="btn-browse">📁 Examinar</button>
                        </div>
                    </div>
                </div>

                <div class="separator"></div>

                <div class="config-section">
                    <div class="config-title">📄 Tipo de Documento</div>
                    <div class="config-field">
                        <label>Tipo</label>
                        <select class="select-field">
                            <option selected>factura_proveedor</option>
                            <option>factura_cliente</option>
                            <option>ticket</option>
                            <option>albarán</option>
                            <option>otro</option>
                        </select>
                    </div>
                </div>

                <button class="btn-save">💾 GUARDAR CONFIGURACIÓN</button>
            </div>

            <!-- TAB 2: PROCESAR -->
            <div class="tab-content" id="tab1">
                
                <div class="process-header">
                    <div class="state-display state-ready">
                        <div class="state-dot-ready"></div>
                        ● LISTO
                    </div>
                    <button class="btn-process" onclick="simulateProcessing()">▶ PROCESAR FACTURAS</button>
                </div>

                <div class="log-label">📋 Log de ejecución</div>
                <div class="log-box" id="logBox">
                    <div class="log-entry log-info">[09:30:45] Agente iniciado</div>
                    <div class="log-entry log-info">[09:30:45] Configuración cargada ✓</div>
                </div>

                <div class="log-label">📊 Resumen</div>
                <div class="summary-box" id="summaryBox">
                    <div class="summary-line">Esperando procesamiento...</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function switchTab(index) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(el => {
                el.classList.remove('active');
            });

            // Show selected tab
            document.getElementById('tab' + index).classList.add('active');
            document.querySelectorAll('.tab')[index].classList.add('active');
        }

        function simulateProcessing() {
            const logBox = document.getElementById('logBox');
            const summaryBox = document.getElementById('summaryBox');
            
            // Clear log
            logBox.innerHTML = '';
            summaryBox.innerHTML = '<div class="summary-line">Procesando...</div>';

            // Simulate processing
            const steps = [
                { msg: '[09:31:00] Validando rutas...', type: 'info' },
                { msg: '[09:31:01] ✓ Rutas validadas', type: 'success' },
                { msg: '[09:31:02] Buscando PDFs en entrada...', type: 'info' },
                { msg: '[09:31:03] ✓ Encontrados 3 PDFs', type: 'success' },
                { msg: '', type: 'info' },
                { msg: '[09:31:04] [1/3] Procesando: factura-001.pdf', type: 'info' },
                { msg: '[09:31:09]   ✓ Extraído | 2145 tokens | €0.0321', type: 'success' },
                { msg: '[09:31:10]   ✓ LISTO | Campos vacíos: 0', type: 'success' },
                { msg: '[09:31:11]   💾 JSON guardado', type: 'success' },
                { msg: '', type: 'info' },
                { msg: '[09:31:12] [2/3] Procesando: factura-002.pdf', type: 'info' },
                { msg: '[09:31:17]   ✓ Extraído | 1998 tokens | €0.0299', type: 'success' },
                { msg: '[09:31:18]   ⚠ REVISAR | Campos vacíos: 2', type: 'warning' },
                { msg: '[09:31:19]   💾 JSON guardado', type: 'success' },
                { msg: '', type: 'info' },
                { msg: '[09:31:20] [3/3] Procesando: factura-003.pdf', type: 'info' },
                { msg: '[09:31:25]   ✓ Extraído | 2245 tokens | €0.0336', type: 'success' },
                { msg: '[09:31:26]   ✓ LISTO | Campos vacíos: 0', type: 'success' },
                { msg: '[09:31:27]   💾 JSON guardado', type: 'success' },
                { msg: '', type: 'info' },
                { msg: '[09:31:28] ✓ CSV guardado: resumen_2026-08-25_093128.csv', type: 'success' },
                { msg: '', type: 'info' },
                { msg: '════════════════════════════════════════════════', type: 'info' },
                { msg: '✓ PROCESAMIENTO COMPLETADO', type: 'success' },
            ];

            let index = 0;
            const interval = setInterval(() => {
                if (index < steps.length) {
                    const step = steps[index];
                    if (step.msg) {
                        const div = document.createElement('div');
                        div.className = `log-entry log-${step.type}`;
                        div.textContent = step.msg;
                        logBox.appendChild(div);
                    }
                    logBox.scrollTop = logBox.scrollHeight;
                    index++;
                } else {
                    clearInterval(interval);
                    summaryBox.innerHTML = `
                        <div class="summary-line">✓ PROCESAMIENTO COMPLETADO</div>
                        <div class="summary-line"></div>
                        <div class="summary-line">  Total: 3 documentos</div>
                        <div class="summary-line">  Listos: 2 ✓</div>
                        <div class="summary-line">  Revisar: 1 ⚠</div>
                        <div class="summary-line">  Coste total: €0.0956</div>
                        <div class="summary-line">  Éxito: 67%</div>
                    `;
                }
            }, 400);
        }
    </script>
</body>
</html>
